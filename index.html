<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alurika — Belajar Algoritma & Struktur Data Secara Interaktif</title>
  <meta name="description" content="Alurika adalah platform belajar algoritma dan struktur data secara interaktif. Mulai dari logika dasar hingga graf kompleks, pelajari dengan visualisasi real-time.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

</head>
<body class="min-h-screen font-sans antialiased bg-surface-body text-text-heading selection:bg-accent-purple/20 selection:text-accent-purple">
<header id="shell" class="hero-gradient animate-gradient-shift relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] rounded-full border border-white/[0.06] animate-pulse-ring pointer-events-none" aria-hidden="true"></div>
    <div class="absolute top-20 right-[-120px] w-[400px] h-[400px] rounded-full border border-white/[0.08] animate-pulse-ring pointer-events-none" style="animation-delay: 1s;" aria-hidden="true"></div>
    <div class="absolute bottom-[-80px] left-1/3 w-[350px] h-[350px] rounded-full bg-white/[0.03] animate-float pointer-events-none" aria-hidden="true"></div>
    <div class="absolute top-1/2 right-1/4 w-[200px] h-[200px] rounded-full bg-accent-pink/[0.06] animate-float-delayed pointer-events-none" aria-hidden="true"></div>
    <!-- Top Navigation Bar (Frosted Glass Pill) -->
    <nav class="relative z-30 max-w-7xl mx-auto px-6 sm:px-10 pt-6 pb-4">

          <div class="w-11 h-11 rounded-2xl bg-white flex items-center justify-center shadow-lg group-hover:shadow-xl transition-shadow duration-300">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="text-hero-indigo">
              <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#5B3281"/>
              <path d="M2 17l10 5 10-5" stroke="#D9536F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12l10 5 10-5" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <span class="text-2xl font-extrabold text-white tracking-tight font-display">Alurika</span>
            <span class="hidden sm:inline-block ml-2.5 px-2.5 py-0.5 text-[10px] font-bold tracking-widest uppercase bg-white/15 text-white/90 rounded-full">Beta</span>
          </div>
        </a>

        <!-- Navigation Tabs -->
        <div class="glass-nav p-1.5 rounded-full flex items-center gap-0.5 text-sm font-semibold overflow-x-auto max-w-full" id="main-nav"><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-beranda" data-act="go" data-t="beranda" title="Beranda"><span class="ni"><i data-lucide="home" class="w-4 h-4"></i></span><span class="hidden sm:inline">Beranda</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-kurikulum" data-act="go" data-t="kurikulum" title="Kurikulum"><span class="ni"><i data-lucide="book-open" class="w-4 h-4"></i></span><span class="hidden sm:inline">Kurikulum</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-diagnostik" data-act="go" data-t="diagnostik" title="Diagnostik"><span class="ni"><i data-lucide="target" class="w-4 h-4"></i></span><span class="hidden sm:inline">Diagnostik</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-materi" data-act="go" data-t="materi" title="Materi"><span class="ni"><i data-lucide="layers" class="w-4 h-4"></i></span><span class="hidden sm:inline">Materi</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-lkpd" data-act="go" data-t="lkpd" title="LKPD"><span class="ni"><i data-lucide="clipboard-list" class="w-4 h-4"></i></span><span class="hidden sm:inline">LKPD</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-visualizer" data-act="go" data-t="visualizer" title="Visualizer"><span class="ni"><i data-lucide="git-branch" class="w-4 h-4"></i></span><span class="hidden sm:inline">Visualizer</span></button><button class="nav-tab px-4 py-2 rounded-full text-white/70 whitespace-nowrap flex items-center gap-2" id="nav-formatif" data-act="go" data-t="formatif" title="Tantangan"><span class="ni"><i data-lucide="trophy" class="w-4 h-4"></i></span><span class="hidden sm:inline">Tantangan</span></button>
        </div>

        <!-- Profile -->
        <div class="flex items-center gap-3">
          <div class="hidden md:flex flex-col items-end">
            <span id="profile-name" class="text-xs font-bold text-white leading-tight">Siswa</span>
            <span class="text-[10px] text-white/60">Informatika Fase E</span>
          </div>
          <button id="profile-btn" data-act="profile" class="w-10 h-10 rounded-full bg-white/15 border border-white/20 flex items-center justify-center text-white hover:bg-white/25 transition-colors" aria-label="Profil pengguna">
            <i data-lucide="user" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </nav>
<div id="view" class="relative z-20"></div>
    </header>
<footer class="bg-canvas-dark text-white/60 text-xs px-6 sm:px-10 py-8 pb-28"><div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3"><span><b class="text-white font-display">Alurika</b> · Media Pembelajaran Interaktif · Informatika Fase E · Konsep Dasar Tree</span><span class="px-2.5 py-1 rounded-full bg-white/10 text-white/80">Jawaban &amp; progres tersimpan di browser perangkat ini saja (localStorage).</span></div></footer>
  <!-- ===== FLOATING BOTTOM STATUS BAR ===== -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-2xl" id="status-bar">
    <div class="glass-status rounded-2xl px-5 py-3 flex items-center justify-between gap-4 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-accent-purple/20 flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-accent-purple"></i>
        </div>
        <div class="hidden sm:block">
          <p class="text-xs font-bold text-white leading-tight">Alurika Learning Platform</p>
          <p id="sb-sub" class="text-[10px] text-white/50">Informatika Fase E</p>
        </div>
      </div>

      <!-- Progress mini -->
      <div class="flex items-center gap-4 flex-1 max-w-xs">
        <div class="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden">
          <div id="sb-bar" class="h-full w-[0%] bg-gradient-to-r from-accent-purple via-accent-pink to-accent-teal rounded-full progress-shimmer"></div>
        </div>
        <span class="text-[11px] font-bold text-white/80 whitespace-nowrap"id="sb-pct">0%</span>
      </div>

      <!-- Info badges -->
      <div class="flex items-center gap-2">
        <span class="px-2.5 py-1 rounded-full bg-white/10 text-white/70 text-[10px] font-medium flex items-center gap-1.5">
          <i data-lucide="hard-drive" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Tersimpan Lokal</span>
        </span>
        <span class="px-2.5 py-1 rounded-full bg-emerald-400/15 text-emerald-400 text-[10px] font-bold flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
          Online
        </span>
      </div>
    </div>
  </div>
<div id="progress-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"><div class="glass-card max-w-md w-full rounded-3xl p-6 shadow-2xl border-2 border-white animate-fadeIn text-slate-700"><div class="flex items-center justify-between border-b border-slate-100 pb-3"><h3 class="font-bold text-slate-800 flex items-center gap-2"><span>🏅</span> Portofolio &amp; Progres</h3><button onclick="toggleProgressModal()" aria-label="Tutup" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600">✕</button></div><div id="pm-body" class="mt-4"></div></div></div>
<div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4"><div class="glass-card max-w-sm w-full rounded-3xl p-6 shadow-2xl border-2 border-white text-slate-700"><p id="cf-msg" class="text-sm mb-5"></p><div class="flex justify-end gap-2"><button id="cf-no" class="px-4 py-2 rounded-xl bg-slate-100 font-bold text-sm">Batal</button><button id="cf-ok" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold text-sm">Ya, lanjutkan</button></div></div></div>
<template id="tpl-hero">    <div class="relative z-20 max-w-7xl mx-auto px-6 sm:px-10 pt-10 pb-20 sm:pb-28">
      <div class="grid lg:grid-cols-2 gap-12 items-center">

        <!-- Left: Text -->
        <div class="animate-fade-up">
          <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/15 text-xs font-semibold text-white/90 mb-6">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-300"></i>
            Platform Belajar Algoritma Interaktif
          </div>
          <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-white leading-[1.1] tracking-tight font-display mb-6">
            Kuasai Algoritma<br>
            <span class="gradient-text">&amp; Struktur Data</span>
          </h1>
          <p class="text-lg sm:text-xl text-white/70 leading-relaxed max-w-xl mb-8">
            Dari logika pemrograman dasar hingga graf kompleks — pelajari dengan visualisasi interaktif, latihan langsung, dan jalur pembelajaran terstruktur.
          </p>

          <!-- CTA Buttons -->
          <div class="flex flex-wrap gap-4">
            <button id="cta-start" data-act="go" data-t="diagnostik" class="group px-7 py-3.5 rounded-2xl bg-white text-hero-indigo font-bold text-sm flex items-center gap-2.5 shadow-lg shadow-black/10 hover:shadow-xl hover:shadow-black/15 transition-all duration-300 hover:-translate-y-0.5">
              Mulai Belajar
              <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
            </button>
            <button id="cta-demo" data-act="go" data-t="visualizer" class="px-7 py-3.5 rounded-2xl bg-white/10 border border-white/20 text-white font-bold text-sm flex items-center gap-2.5 hover:bg-white/15 transition-all duration-300">
              <i data-lucide="play-circle" class="w-4 h-4"></i>
              Coba Visualizer
            </button>
          </div>
        </div>

        <!-- Right: Interactive Tree Visualization Preview -->
        <div class="animate-fade-up-delayed hidden lg:block">
          <div class="relative">
            <!-- Glow backdrop -->
            <div class="absolute inset-0 bg-gradient-to-br from-accent-purple/20 via-transparent to-accent-pink/20 rounded-3xl blur-3xl" aria-hidden="true"></div>

            <!-- Code Canvas Card -->
            <div class="relative code-canvas rounded-3xl p-6 shadow-2xl border border-white/10">
              <!-- Window chrome -->
              <div class="flex items-center justify-between mb-5">
                <div class="flex items-center gap-2">
                  <div class="w-3 h-3 rounded-full bg-red-400/80"></div>
                  <div class="w-3 h-3 rounded-full bg-amber-400/80"></div>
                  <div class="w-3 h-3 rounded-full bg-emerald-400/80"></div>
                </div>
                <span class="text-xs text-white/30 font-medium tracking-wide">tree_visualizer.py</span>
                <div class="flex items-center gap-2 text-white/30">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                </div>
              </div>

              <!-- Interactive Tree SVG -->
              <div class="flex justify-center py-4">
                <svg width="320" height="220" viewBox="0 0 320 220" fill="none" class="drop-shadow-lg">
                  <!-- Edges -->
                  <line x1="160" y1="36" x2="80" y2="100" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.5"/>
                  <line x1="160" y1="36" x2="240" y2="100" stroke="#7C3AED" stroke-width="2" stroke-opacity="0.5"/>
                  <line x1="80" y1="100" x2="40" y2="170" stroke="#E11D48" stroke-width="2" stroke-opacity="0.4"/>
                  <line x1="80" y1="100" x2="120" y2="170" stroke="#E11D48" stroke-width="2" stroke-opacity="0.4"/>
                  <line x1="240" y1="100" x2="200" y2="170" stroke="#0D9488" stroke-width="2" stroke-opacity="0.4"/>
                  <line x1="240" y1="100" x2="280" y2="170" stroke="#0D9488" stroke-width="2" stroke-opacity="0.4"/>

                  <!-- Root Node -->
                  <g class="tree-node cursor-pointer">
                    <circle cx="160" cy="32" r="22" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="2"/>
                    <circle cx="160" cy="32" r="14" fill="#7C3AED"/>
                    <text x="160" y="37" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Space Grotesk">A</text>
                  </g>
                  <!-- Label -->
                  <text x="160" y="12" text-anchor="middle" fill="#C4B5FD" font-size="9" font-weight="600" font-family="Plus Jakarta Sans">root</text>

                  <!-- Level 1 Nodes -->
                  <g class="tree-node cursor-pointer">
                    <circle cx="80" cy="100" r="18" fill="#E11D48" fill-opacity="0.12" stroke="#E11D48" stroke-width="1.5"/>
                    <circle cx="80" cy="100" r="12" fill="#E11D48"/>
                    <text x="80" y="105" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="Space Grotesk">B</text>
                  </g>
                  <g class="tree-node cursor-pointer">
                    <circle cx="240" cy="100" r="18" fill="#0D9488" fill-opacity="0.12" stroke="#0D9488" stroke-width="1.5"/>
                    <circle cx="240" cy="100" r="12" fill="#0D9488"/>
                    <text x="240" y="105" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="Space Grotesk">C</text>
                  </g>

                  <!-- Level 2 Nodes (Leaves) -->
                  <g class="tree-node cursor-pointer">
                    <circle cx="40" cy="170" r="15" fill="#E11D48" fill-opacity="0.08" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 2"/>
                    <circle cx="40" cy="170" r="10" fill="#E11D48" fill-opacity="0.6"/>
                    <text x="40" y="174" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="Space Grotesk">D</text>
                  </g>
                  <g class="tree-node cursor-pointer">
                    <circle cx="120" cy="170" r="15" fill="#E11D48" fill-opacity="0.08" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 2"/>
                    <circle cx="120" cy="170" r="10" fill="#E11D48" fill-opacity="0.6"/>
                    <text x="120" y="174" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="Space Grotesk">E</text>
                  </g>
                  <g class="tree-node cursor-pointer">
                    <circle cx="200" cy="170" r="15" fill="#0D9488" fill-opacity="0.08" stroke="#0D9488" stroke-width="1" stroke-dasharray="4 2"/>
                    <circle cx="200" cy="170" r="10" fill="#0D9488" fill-opacity="0.6"/>
                    <text x="200" y="174" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="Space Grotesk">F</text>
                  </g>
                  <g class="tree-node cursor-pointer">
                    <circle cx="280" cy="170" r="15" fill="#0D9488" fill-opacity="0.08" stroke="#0D9488" stroke-width="1" stroke-dasharray="4 2"/>
                    <circle cx="280" cy="170" r="10" fill="#0D9488" fill-opacity="0.6"/>
                    <text x="280" y="174" text-anchor="middle" fill="white" font-size="10" font-weight="600" font-family="Space Grotesk">G</text>
                  </g>

                  <!-- Labels for leaves -->
                  <text x="40" y="198" text-anchor="middle" fill="#64748B" font-size="8" font-family="Plus Jakarta Sans">leaf</text>
                  <text x="120" y="198" text-anchor="middle" fill="#64748B" font-size="8" font-family="Plus Jakarta Sans">leaf</text>
                  <text x="200" y="198" text-anchor="middle" fill="#64748B" font-size="8" font-family="Plus Jakarta Sans">leaf</text>
                  <text x="280" y="198" text-anchor="middle" fill="#64748B" font-size="8" font-family="Plus Jakarta Sans">leaf</text>
                </svg>
              </div>

              <!-- Code snippet -->
              <div class="mt-3 text-[13px] leading-relaxed">
                <div><span class="text-violet-400">class</span> <span class="text-amber-300">TreeNode</span><span class="text-white/50">:</span></div>
                <div class="pl-4"><span class="text-violet-400">def</span> <span class="text-sky-300">__init__</span><span class="text-white/40">(</span><span class="text-orange-300">self</span><span class="text-white/40">,</span> <span class="text-white/80">value</span><span class="text-white/40">):</span></div>
                <div class="pl-8"><span class="text-orange-300">self</span><span class="text-white/40">.</span><span class="text-white/80">value</span> <span class="text-white/40">=</span> <span class="text-white/80">value</span></div>
                <div class="pl-8"><span class="text-orange-300">self</span><span class="text-white/40">.</span><span class="text-white/80">children</span> <span class="text-white/40">=</span> <span class="text-white/40">[]</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div></template>
<script src="data/modulTree.js"></script>
